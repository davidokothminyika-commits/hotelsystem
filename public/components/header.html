<!--
  components/header.html
  =====================
  Shared site header. Loaded at runtime into every page by
  public/js/components/loader.js, so the navigation exists once.

  The markup is static and generic. Page specific links and the user menu are
  populated by public/js/components/header.js, which fetches the session from
  /api/auth/me. Keeping them separate means the header shows correct
  "signed out" content immediately rather than flashing placeholder links.
-->
<header class="sticky top-0 z-30 bg-stone-900 text-stone-100 shadow-md">
    <div class="flex items-center justify-between gap-4 px-4 sm:px-6 h-16">

        <!-- Brand. The name, tagline and logo are written in by
             public/js/components/branding.js, so an administrator can change
             them from the settings screen without editing this file. -->
        <a href="/" class="flex items-center gap-2.5 shrink-0 group">
            <span data-brand="logo" class="flex items-center justify-center w-9 h-9 rounded-lg bg-amber-600 text-stone-900"></span>
            <span class="hidden sm:block">
                <span class="block text-sm font-semibold tracking-wide text-white leading-tight" data-brand="name">
                    Aurelia Grand Hotel
                </span>
                <span class="block text-[11px] text-stone-400 leading-tight" data-brand="tagline">
                    Nairobi, Kenya
                </span>
            </span>
        </a>

        <!-- Primary navigation -->
        <nav class="hidden md:flex items-center gap-1" aria-label="Main navigation">
            <a href="/" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="home">Home</a>
            <a href="/pages/guest/rooms.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="rooms">Rooms</a>
            <a href="/pages/guest/restaurant.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="restaurant">Restaurant</a>
            <a href="/pages/guest/bookings.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="bookings">My Bookings</a>
            <a href="/pages/guest/reviews.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="reviews">Reviews</a>
            <a href="/pages/guest/messages.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white hover:bg-white/5 rounded-md transition"
               data-nav="messages">Contact</a>
        </nav>

        <!-- Right side: notifications, account -->
        <div class="flex items-center gap-2">

            <!-- Notification bell. Badge count is filled in by header.js. -->
            <button type="button"
                    id="notification-button"
                    class="relative p-2 rounded-md text-stone-300 hover:text-white hover:bg-white/5 transition"
                    aria-label="Notifications"
                    hidden>
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
                <span id="notification-badge"
                      class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full bg-amber-600 text-stone-900 text-[11px] font-bold hidden"></span>
            </button>

            <!-- Signed out state -->
            <div id="header-authenticated" class="flex items-center gap-2" hidden>
                <a href="/pages/auth/login.html" class="btn btn-outline btn-sm text-stone-100 border-stone-600 hover:bg-white/10">
                    Sign in
                </a>
                <a href="/pages/auth/register.html" class="btn btn-primary btn-sm">
                    Book now
                </a>
            </div>

            <!-- Signed in state. Populated by header.js. -->
            <div id="header-signed-in" class="relative hidden">
                <button type="button"
                        id="user-menu-button"
                        class="flex items-center gap-2 p-1.5 pr-2 rounded-md hover:bg-white/5 transition"
                        aria-haspopup="menu"
                        aria-expanded="false">
                    <span id="user-avatar"
                          class="flex items-center justify-center w-8 h-8 rounded-full bg-amber-600 text-stone-900 text-xs font-bold"
                          aria-hidden="true">--</span>
                    <span class="hidden lg:block text-sm text-stone-200" id="user-display-name"></span>
                    <i class="fa-solid fa-chevron-down text-xs text-stone-400" aria-hidden="true"></i>
                </button>

                <!-- Dropdown. Built by header.js so links depend on the role. -->
                <div id="user-menu"
                     class="hidden absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-stone-200 py-1"
                     role="menu"
                     aria-labelledby="user-menu-button">
                    <div class="px-4 py-2 border-b border-stone-100">
                        <p class="text-sm font-medium text-stone-900 truncate" id="user-menu-email"></p>
                        <p class="text-xs text-stone-500 capitalize" id="user-menu-role"></p>
                    </div>
                    <div id="user-menu-links" class="py-1"></div>
                    <div class="border-t border-stone-100 mt-1 pt-1">
                        <button type="button"
                                id="logout-button"
                                class="w-full text-left px-4 py-2 text-sm text-red-700 hover:bg-red-50 transition"
                                role="menuitem">
                            <i class="fa-solid fa-right-from-bracket mr-2" aria-hidden="true"></i>
                            Sign out
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mobile menu toggle -->
            <button type="button"
                    id="mobile-menu-button"
                    class="md:hidden p-2 rounded-md text-stone-300 hover:text-white hover:bg-white/5 transition"
                    aria-label="Open menu"
                    aria-controls="mobile-menu"
                    aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Mobile navigation drawer -->
    <div id="mobile-menu" class="md:hidden hidden border-t border-stone-700 bg-stone-900">
        <nav class="px-4 py-3 flex flex-col gap-1" aria-label="Mobile navigation">
            <a href="/" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">Home</a>
            <a href="/pages/guest/rooms.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">Rooms</a>
            <a href="/pages/guest/restaurant.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">Restaurant</a>
            <a href="/pages/guest/bookings.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">My Bookings</a>
            <a href="/pages/guest/reviews.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">Reviews</a>
            <a href="/pages/guest/messages.html" class="px-3 py-2 text-sm text-stone-300 hover:text-white rounded-md">Contact</a>
        </nav>
    </div>
</header>
