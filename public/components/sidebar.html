<!--
  components/sidebar.html
  =====================
  Dashboard sidebar, shared by the guest, staff and admin areas.

  The navigation items are rendered by public/js/components/sidebar.js, which
  receives the items for the current role. Rendering them from data rather than
  hard coding them here means the guest, reception, housekeeping, restaurant,
  manager and admin variants all use this one file.
-->
<aside id="app-sidebar" class="sidebar">
    <div class="flex flex-col h-full min-h-0">

        <!-- Brand and collapse control -->
        <div class="flex items-center justify-between gap-2 px-4 h-16 shrink-0 border-b border-stone-800/80">
            <a href="/" class="flex items-center gap-2.5 min-w-0">
                <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-amber-600 text-stone-900 shrink-0">
                    <i class="fa-solid fa-hotel" aria-hidden="true"></i>
                </span>
                <span class="sidebar-user-info min-w-0">
                    <span class="block text-xs font-semibold text-white truncate">Aurelia Grand</span>
                    <span class="block text-[10px] text-stone-500 truncate" id="sidebar-role">Dashboard</span>
                </span>
            </a>

            <!-- Collapses to an icon rail on desktop, closes on mobile -->
            <button type="button"
                    id="sidebar-toggle"
                    class="p-2 rounded-md text-stone-400 hover:text-white hover:bg-white/5 transition shrink-0"
                    aria-label="Collapse sidebar"
                    aria-expanded="true">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Navigation, populated by sidebar.js.

             This is the only scrollable region. The brand row above and the
             identity and sign out footer below are fixed, so the sidebar shell
             never moves and the brand does not scroll away. -->
        <nav id="sidebar-nav" class="sidebar-nav flex-1 min-h-0 overflow-y-auto py-3" aria-label="Dashboard navigation">
            <p class="px-4 py-2 text-xs text-stone-500">Loading navigation...</p>
        </nav>

        <!-- Signed in identity, plus the sign out control.

             This footer sits outside the scrolling nav region, so the sign out
             button stays reachable no matter how many navigation items a role
             has. It is the primary way out of the dashboard for anyone using a
             phone, where the header account menu is behind two taps. -->
        <div class="sidebar-footer px-3 py-3 border-t border-stone-800/80 shrink-0 bg-stone-900/40">
            <a href="/pages/guest/profile.html"
               class="sidebar-user-info flex items-center gap-2.5 px-2 py-2 rounded-lg hover:bg-white/5 transition group">
                <span id="sidebar-avatar"
                      class="flex items-center justify-center w-9 h-9 rounded-full bg-amber-600 text-stone-900 text-xs font-bold shrink-0"
                      aria-hidden="true">--</span>
                <span class="min-w-0 flex-1">
                    <span class="block text-xs font-semibold text-white truncate group-hover:text-amber-400 transition" id="sidebar-name"></span>
                    <span class="block text-[10px] text-stone-500 truncate" id="sidebar-email"></span>
                </span>
                <i class="fa-solid fa-chevron-right text-[10px] text-stone-600 group-hover:text-amber-500 transition" aria-hidden="true"></i>
            </a>

            <!-- Sign out. Populated as a real button by sidebar.js. -->
            <button type="button"
                    id="sidebar-logout"
                    class="nav-link mt-1 w-full text-red-400 hover:text-red-300 hover:bg-red-500/10"
                    title="Sign out">
                <i class="fa-solid fa-right-from-bracket w-4 text-center shrink-0" aria-hidden="true"></i>
                <span class="nav-label">Sign out</span>
            </button>
        </div>
    </div>
</aside>

<!-- Dims the page behind the sidebar on small screens -->
<div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
